<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b141a" />
  <title>Chat</title>

  <style>
    /* ── TOKENS ── */
    :root {
      --bg:          #0b141a;
      --panel:       #111b21;
      --panel-2:     #202c33;
      --panel-3:     #182229;
      --text:        #e9edef;
      --muted:       #8696a0;
      --green:       #00a884;
      --bubble-me:   #005c4b;
      --bubble-her:  #202c33;
      --line:        #2a3942;
      --hover:       #ffffff0d;
      --active:      #2a3942;
      --shadow:      0 1px 2px rgba(0,0,0,.35);
      --sidebar-w:   340px;
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;
      background: #0c1317;
      color: var(--text);
    }
    button, textarea { font: inherit; }
    img { display: block; }

    /* ── SHELL ── */
    .shell {
      width: 100%;
      max-width: 1600px;
      height: 100dvh;
      margin: auto;
      display: flex;
      background: var(--bg);
      box-shadow: 0 0 40px rgba(0,0,0,.4);
    }

    /* ══════════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar-w);
      flex: 0 0 var(--sidebar-w);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid rgba(255,255,255,.04);
      overflow: hidden;
      transition: transform .22s ease;
      z-index: 20;
    }

    .sidebar-header {
      height: 64px;
      min-height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-3);
      border-bottom: 1px solid rgba(255,255,255,.03);
    }
    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.3px;
    }

    .sidebar-search {
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid rgba(255,255,255,.03);
    }
    .sidebar-search input {
      width: 100%;
      background: var(--panel-2);
      border: 0;
      outline: 0;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      color: var(--text);
    }
    .sidebar-search input::placeholder { color: var(--muted); }

    .conversations {
      flex: 1;
      overflow-y: auto;
    }
    .conversations::-webkit-scrollbar { width: 5px; }
    .conversations::-webkit-scrollbar-track { background: transparent; }
    .conversations::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    /* conversation item */
    .conv-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,.03);
      transition: background .12s;
      position: relative;
    }
    .conv-item:hover  { background: var(--hover); }
    .conv-item.active { background: var(--active); }

    .conv-avatar {
      position: relative;
      flex: 0 0 auto;
    }
    .conv-avatar img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background: #233138;
    }

    /* online dot */
    .online-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      border: 2px solid var(--panel);
    }

    .conv-info {
      flex: 1;
      min-width: 0;
    }
    .conv-name-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
    }
    .conv-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-time {
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .conv-time.unread { color: var(--green); }

    .conv-preview-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 2px;
    }
    .conv-preview {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .conv-preview.mine { color: var(--muted); }

    .unread-badge {
      flex: 0 0 auto;
      background: var(--green);
      color: #fff;
      font-size: 11.5px;
      font-weight: 700;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }
    .unread-badge.hidden { display: none; }

    /* ══════════════════════════════════════════
       CHAT PANEL
    ══════════════════════════════════════════ */
    .chat-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--muted);
      background: var(--bg);
    }
    .empty-state svg { opacity: .25; }
    .empty-state p { font-size: 15px; }

    /* topbar */
    .topbar {
      min-height: 64px;
      padding: 8px 12px 8px 16px;
      display: flex;
      align-items: center;
      gap: 11px;
      background: var(--panel-3);
      border-bottom: 1px solid rgba(255,255,255,.03);
      z-index: 10;
      flex: 0 0 auto;
    }

    /* mobile back btn */
    .back-btn {
      display: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      place-items: center;
    }
    .back-btn svg { width: 20px; height: 20px; fill: currentColor; }

    .topbar-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #233138;
      flex: 0 0 auto;
      cursor: pointer;
    }
    .topbar-person { min-width: 0; flex: 1; }
    .topbar-name {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-status {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-actions { display: flex; gap: 4px; }
    .icon-btn {
      border: 0;
      background: transparent;
      color: #aebac1;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg { width: 21px; height: 21px; fill: currentColor; }

    /* chat messages area */
    .chat {
      position: relative;
      flex: 1;
      overflow-y: auto;
      padding: 18px max(14px, calc((100% - 900px)/2)) 12px;
      scroll-behavior: smooth;
      background:
        linear-gradient(rgba(11,20,26,.94), rgba(11,20,26,.94)),
        radial-gradient(circle at 20% 20%, #5b6b6f 0 1px, transparent 1.2px) 0 0/28px 28px,
        radial-gradient(circle at 80% 50%, #5b6b6f 0 1px, transparent 1.2px) 0 0/34px 34px,
        #0b141a;
    }
    .chat::-webkit-scrollbar { width: 5px; }
    .chat::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    /* date label */
    .day {
      width: max-content;
      max-width: 90%;
      margin: 4px auto 18px;
      padding: 6px 12px;
      color: #d1d7db;
      background: #182229;
      border-radius: 7px;
      font-size: 11.5px;
      box-shadow: var(--shadow);
    }

    /* system note */
    .system-note {
      max-width: 520px;
      margin: 0 auto 18px;
      padding: 8px 12px;
      background: #182229;
      color: #aebac1;
      border-radius: 8px;
      font-size: 11.5px;
      text-align: center;
      line-height: 1.35;
      box-shadow: var(--shadow);
    }

    /* rows */
    .row { display: flex; margin: 2px 0 5px; }
    .row.me  { justify-content: flex-end; }
    .row.her { justify-content: flex-start; }

    /* bubbles */
    .bubble {
      position: relative;
      max-width: min(76%, 650px);
      padding: 7px 9px 6px;
      border-radius: 7.5px;
      box-shadow: var(--shadow);
      line-height: 1.35;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 14.2px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      column-gap: 7px;
    }
    .me  .bubble { background: var(--bubble-me);  border-top-right-radius: 2px; }
    .her .bubble { background: var(--bubble-her); border-top-left-radius:  2px; }

    .bubble-content {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .meta {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
      color: #a8b3b9;
      font-size: 10.5px;
      line-height: 1;
      white-space: nowrap;
      align-self: end;
      padding-bottom: 1px;
    }
    .ticks {
      font-size: 12px;
      color: #53bdeb;
      letter-spacing: -2px;
      padding-right: 2px;
    }

    /* typing dots */
    .typing-bubble {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      min-width: 50px;
      height: 30px;
    }
    .typing-bubble i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8c9aa3;
      animation: bounce 1.1s infinite ease-in-out;
    }
    .typing-bubble i:nth-child(2) { animation-delay: .13s; }
    .typing-bubble i:nth-child(3) { animation-delay: .26s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0);    opacity: .55; }
      30%            { transform: translateY(-4px); opacity: 1;   }
    }

    /* composer */
    .composer {
      min-height: 62px;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--panel-3);
      border-top: 1px solid rgba(255,255,255,.03);
      flex: 0 0 auto;
    }
    .input-wrap {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: var(--panel-2);
      border-radius: 22px;
      padding: 0 8px 0 10px;
    }
    #messageInput {
      width: 100%;
      max-height: 120px;
      min-height: 42px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 11px 4px 10px;
      line-height: 20px;
    }
    #messageInput::placeholder { color: #8696a0; }

    .send {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 0;
      display: grid;
      place-items: center;
      background: var(--green);
      color: white;
      cursor: pointer;
      transition: .15s;
    }
    .send:disabled { opacity: .45; cursor: not-allowed; }
    .send svg { width: 21px; height: 21px; fill: currentColor; transform: translateX(1px); }

    /* error toast */
    #errorBox {
      position: fixed;
      left: 50%;
      bottom: 78px;
      transform: translateX(-50%);
      background: #3b181d;
      color: #ffd9dd;
      border: 1px solid #6f2a34;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 13px;
      z-index: 999;
      max-width: min(90vw, 620px);
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    .hidden { display: none !important; }

    /* ══════════════════════════════════════════
       MOBILE  (< 700px)
    ══════════════════════════════════════════ */
    @media (max-width: 699px) {
      .shell { position: relative; }

      .sidebar {
        position: absolute;
        inset: 0;
        width: 100%;
        transform: translateX(0);
      }
      /* when a chat is open, slide sidebar out */
      .shell.chat-open .sidebar {
        transform: translateX(-100%);
        pointer-events: none;
      }

      .chat-panel {
        position: absolute;
        inset: 0;
        transform: translateX(100%);
        transition: transform .22s ease;
        background: var(--bg);
      }
      .shell.chat-open .chat-panel {
        transform: translateX(0);
      }

      .back-btn { display: grid; }
    }

    /* ══════════════════════════════════════════
       DESKTOP extras
    ══════════════════════════════════════════ */
    @media (min-width: 700px) {
      body { background: #0c1317; }
      .shell {
        border-left:  1px solid #1e2b32;
        border-right: 1px solid #1e2b32;
      }
    }
    @media (min-width: 900px) {
      .topbar  { padding-left: 18px; padding-right: 18px; }
      .composer { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>

<body>
  <div class="shell" id="shell">

    <!-- ════ SIDEBAR ════ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Conversas</span>
      </div>

      <div class="sidebar-search">
        <input type="search" id="searchInput" placeholder="Pesquisar conversa" autocomplete="off" />
      </div>

      <div class="conversations" id="convList">
        <!-- items injetados por JS -->
      </div>
    </aside>

    <!-- ════ CHAT PANEL ════ -->
    <div class="chat-panel" id="chatPanel">

      <!-- empty state (nenhuma conversa selecionada no desktop) -->
      <div class="empty-state" id="emptyState">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none">
          <path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2z" stroke="#e9edef" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <p>Selecione uma conversa</p>
      </div>

      <!-- topbar (oculta enquanto empty) -->
      <header class="topbar hidden" id="topbar">
        <button class="back-btn" id="backBtn" aria-label="Voltar">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>

        <img id="topbarAvatar" class="topbar-avatar" src="" alt="" />

        <div class="topbar-person">
          <div id="topbarName"   class="topbar-name"></div>
          <div id="topbarStatus" class="topbar-status"></div>
        </div>

        <div class="top-actions">
          <button class="icon-btn" id="clearBtn" title="Limpar conversa" aria-label="Limpar conversa">
            <svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-2 6h10l-1 11H8L7 9Zm3 2v7h2v-7h-2Zm4 0v7h2v-7h-2Z"/></svg>
          </button>
        </div>
      </header>

      <!-- messages -->
      <section class="chat hidden" id="chat" aria-live="polite">
        <div class="day">HOJE</div>
      </section>

      <!-- composer -->
      <footer class="composer hidden" id="composer">
        <div class="input-wrap">
          <textarea
            id="messageInput"
            rows="1"
            autocomplete="off"
            placeholder="Mensagem"
          ></textarea>
        </div>
        <button id="sendBtn" class="send" aria-label="Enviar">
          <svg viewBox="0 0 24 24"><path d="m3.4 20.4 17.45-7.48c.76-.33.76-1.42 0-1.74L3.4 3.7c-.62-.27-1.27.22-1.13.88l1.3 5.94 8.63 1.53-8.63 1.54-1.3 5.93c-.14.66.51 1.15 1.13.88Z"/></svg>
        </button>
      </footer>

    </div><!-- /chat-panel -->
  </div><!-- /shell -->

  <div id="errorBox" class="error hidden"></div>

  <!-- configs -->
  <script src="pessoas-config.js"></script>
  <script src="julia-config.js"></script>
  <script src="yas-config.js"></script>

  <script>
  (() => {
    /* ─────────────────────────────────────────────
       HELPERS
    ───────────────────────────────────────────── */
    const $ = id => document.getElementById(id);

    function nowTime() {
      return new Intl.DateTimeFormat("pt-BR", {
        hour: "2-digit", minute: "2-digit"
      }).format(new Date());
    }

    let errorTimer;
    function showError(msg) {
      const box = $("errorBox");
      box.textContent = msg;
      box.classList.remove("hidden");
      clearTimeout(errorTimer);
      errorTimer = setTimeout(() => box.classList.add("hidden"), 6500);
    }

    function truncate(str, max = 42) {
      if (!str) return "";
      return str.length > max ? str.slice(0, max) + "…" : str;
    }

    /* ─────────────────────────────────────────────
       BUILD PERSONA REGISTRY
       window.PERSONAS_LIST  → array registrado em pessoas-config.js
       each config file exports window.PERSONA_<ID>
    ───────────────────────────────────────────── */
    const PERSONAS_LIST = window.PERSONAS_LIST || [];

    // map id → { cfg, messages, unread }
    const state = {};

    PERSONAS_LIST.forEach(({ id, configVar }) => {
      const cfg = window[configVar] || {};
      state[id] = {
        cfg,
        messages: [],
        unread: 0
      };
    });

    /* ─────────────────────────────────────────────
       PERSISTENCE
    ───────────────────────────────────────────── */
    function storageKey(id) {
      return state[id].cfg.storageKey || `${id}-ai-chat-v1`;
    }

    function save(id) {
      localStorage.setItem(storageKey(id), JSON.stringify(state[id].messages));
    }

    function loadMessages(id) {
      const cfg = state[id].cfg;
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey(id)) || "null");
        if (Array.isArray(saved) && saved.length) {
          state[id].messages = saved;
        } else {
          state[id].messages = Array.isArray(cfg.initialMessages)
            ? cfg.initialMessages.map(m => ({ ...m, time: m.time || nowTime() }))
            : [];
        }
      } catch {
        state[id].messages = [];
      }
    }

    // load all on boot
    PERSONAS_LIST.forEach(({ id }) => loadMessages(id));

    /* ─────────────────────────────────────────────
       SIDEBAR RENDERING
    ───────────────────────────────────────────── */
    const convList = $("convList");

    function lastMsg(id) {
      const msgs = state[id].messages;
      return msgs.length ? msgs[msgs.length - 1] : null;
    }

    function renderSidebar(filter = "") {
      convList.innerHTML = "";
      const q = filter.trim().toLowerCase();

      PERSONAS_LIST.forEach(({ id }) => {
        const { cfg, unread } = state[id];
        if (q && !cfg.name?.toLowerCase().includes(q)) return;

        const last = lastMsg(id);
        const previewText = last
          ? (last.role === "user" ? "Você: " : "") + truncate(last.content)
          : "";
        const previewTime = last?.time || "";

        const item = document.createElement("div");
        item.className = "conv-item" + (currentId === id ? " active" : "");
        item.dataset.id = id;

        item.innerHTML = `
          <div class="conv-avatar">
            <img src="${cfg.photo || ""}" alt="${cfg.name || id}"
                 onerror="this.style.visibility='hidden'">
            <span class="online-dot"></span>
          </div>
          <div class="conv-info">
            <div class="conv-name-row">
              <span class="conv-name">${cfg.name || id}</span>
              <span class="conv-time${unread ? " unread" : ""}">${previewTime}</span>
            </div>
            <div class="conv-preview-row">
              <span class="conv-preview${last?.role === "user" ? " mine" : ""}">${previewText}</span>
              <span class="unread-badge${unread ? "" : " hidden"}">${unread || ""}</span>
            </div>
          </div>`;

        item.addEventListener("click", () => openConversation(id));
        convList.appendChild(item);
      });
    }

    /* ─────────────────────────────────────────────
       CHAT RENDERING
    ───────────────────────────────────────────── */
    const chatEl     = $("chat");
    const emptyState = $("emptyState");
    const topbar     = $("topbar");
    const composer   = $("composer");
    const topbarAv   = $("topbarAvatar");
    const topbarName = $("topbarName");
    const topbarStat = $("topbarStatus");

    function bubble(message, temporary = false) {
      const row = document.createElement("div");
      row.className = `row ${message.role === "user" ? "me" : "her"}`;
      if (temporary) row.dataset.temporary = "true";

      const b = document.createElement("div");
      b.className = "bubble";

      const content = document.createElement("div");
      content.className = "bubble-content";

      if (temporary) {
        const dots = document.createElement("span");
        dots.className = "typing-bubble";
        dots.innerHTML = "<i></i><i></i><i></i>";
        content.appendChild(dots);
      } else {
        content.textContent = message.content;
      }

      b.appendChild(content);

      if (!temporary) {
        const meta = document.createElement("span");
        meta.className = "meta";
        if (message.role === "user") {
          const ticks = document.createElement("span");
          ticks.className = "ticks";
          ticks.textContent = "✓✓";
          meta.appendChild(ticks);
        }
        const t = document.createElement("span");
        t.textContent = message.time || nowTime();
        meta.appendChild(t);
        b.appendChild(meta);
      }

      row.appendChild(b);
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
      return row;
    }

    function renderChat(id) {
      chatEl.querySelectorAll(".row").forEach(el => el.remove());
      state[id].messages.forEach(m => bubble(m));
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    /* ─────────────────────────────────────────────
       OPEN CONVERSATION
    ───────────────────────────────────────────── */
    let currentId = null;

    function openConversation(id) {
      currentId = id;
      const { cfg } = state[id];

      // clear unread
      state[id].unread = 0;

      // topbar
      topbarAv.src   = cfg.photo || "";
      topbarAv.alt   = cfg.name || id;
      topbarName.textContent   = cfg.name || id;
      topbarStat.textContent   = cfg.status || "online";
      document.title = cfg.name || "Chat";

      // show panels
      emptyState.classList.add("hidden");
      topbar.classList.remove("hidden");
      chatEl.classList.remove("hidden");
      composer.classList.remove("hidden");

      renderChat(id);
      renderSidebar($("searchInput").value);

      // mobile: slide to chat
      $("shell").classList.add("chat-open");

      input.focus();
    }

    /* ─────────────────────────────────────────────
       BACK BUTTON (mobile)
    ───────────────────────────────────────────── */
    $("backBtn").addEventListener("click", () => {
      $("shell").classList.remove("chat-open");
    });

    /* ─────────────────────────────────────────────
       SEARCH
    ───────────────────────────────────────────── */
    $("searchInput").addEventListener("input", e => {
      renderSidebar(e.target.value);
    });

    /* ─────────────────────────────────────────────
       SEND MESSAGE
    ───────────────────────────────────────────── */
    const input   = $("messageInput");
    const sendBtn = $("sendBtn");

    let sending = false;

    function autoResize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    }

    async function send() {
      if (!currentId) return;
      const text = input.value.trim();
      if (!text || sending) return;

      const { cfg } = state[currentId];

      if (!cfg.apiUrl || cfg.apiUrl.includes("SEU-WORKER")) {
        showError("Configure apiUrl em " + currentId + "-config.js com a URL do seu Cloudflare Worker.");
        return;
      }

      sending = true;
      sendBtn.disabled = true;

      const userMsg = { role: "user", content: text, time: nowTime() };
      state[currentId].messages.push(userMsg);
      save(currentId);
      bubble(userMsg);
      renderSidebar($("searchInput").value);

      input.value = "";
      autoResize();

      topbarStat.textContent = "digitando…";

      const typingRow = bubble({ role: "assistant", content: "" }, true);

      const minDelay = Number(cfg.minTypingMs || 650);
      const started  = Date.now();

      try {
        const recent = state[currentId].messages
          .slice(-(cfg.maxHistoryMessages || 24))
          .map(({ role, content }) => ({ role, content }));

        const res = await fetch(cfg.apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model:        cfg.model        || "openrouter/free",
            systemPrompt: cfg.systemPrompt || "",
            messages:     recent,
            temperature:  cfg.temperature  ?? 0.85,
            maxTokens:    cfg.maxTokens    || 500
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || `Erro HTTP ${res.status}`);

        const elapsed = Date.now() - started;
        if (elapsed < minDelay) {
          await new Promise(r => setTimeout(r, minDelay - elapsed));
        }

        const answer =
          data?.choices?.[0]?.message?.content?.trim() ||
          data?.content?.trim();

        if (!answer) throw new Error("Resposta vazia da IA.");

        typingRow.remove();

        const assistantMsg = { role: "assistant", content: answer, time: nowTime() };
        state[currentId].messages.push(assistantMsg);
        save(currentId);
        bubble(assistantMsg);
        renderSidebar($("searchInput").value);

      } catch (err) {
        typingRow.remove();
        showError("Não consegui responder: " + (err?.message || "erro desconhecido"));
      } finally {
        topbarStat.textContent = cfg.status || "online";
        sending = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    input.addEventListener("input", autoResize);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    sendBtn.addEventListener("click", send);

    /* ─────────────────────────────────────────────
       CLEAR CONVERSATION
    ───────────────────────────────────────────── */
    $("clearBtn").addEventListener("click", () => {
      if (!currentId) return;
      if (!confirm("Apagar toda a conversa salva neste navegador?")) return;

      const cfg = state[currentId].cfg;
      localStorage.removeItem(storageKey(currentId));
      state[currentId].messages = Array.isArray(cfg.initialMessages)
        ? cfg.initialMessages.map(m => ({ ...m, time: m.time || nowTime() }))
        : [];
      save(currentId);
      renderChat(currentId);
      renderSidebar($("searchInput").value);
    });

    /* ─────────────────────────────────────────────
       INIT
    ───────────────────────────────────────────── */

    // mark unread for personas whose initialMessages were never seen
    PERSONAS_LIST.forEach(({ id }) => {
      const { cfg, messages } = state[id];
      if (
        Array.isArray(cfg.initialMessages) &&
        cfg.initialMessages.length &&
        messages.length === cfg.initialMessages.length &&
        messages.every((m, i) => m.role === cfg.initialMessages[i].role)
      ) {
        // first time user (only initial messages present) — show badge
        state[id].unread = cfg.initialMessages.filter(m => m.role !== "user").length;
      }
    });

    // on desktop, auto-open first persona
    if (window.innerWidth >= 700 && PERSONAS_LIST.length) {
      openConversation(PERSONAS_LIST[0].id);
    } else {
      renderSidebar();
    }

    autoResize();
  })();
  </script>
</body>
</html>
