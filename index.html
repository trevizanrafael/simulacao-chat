<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b141a">
  <title>Chat</title>
  <style>
    /* ── TOKENS ── */
    :root {
      --bg:        #0b141a;
      --panel:     #111b21;
      --panel-2:   #202c33;
      --panel-3:   #182229;
      --text:      #e9edef;
      --muted:     #8696a0;
      --green:     #00a884;
      --bubble-me: #005c4b;
      --bubble-her:#202c33;
      --line:      #2a3942;
      --hover:     rgba(255,255,255,.06);
      --active:    #2a3942;
      --danger:    #e74c3c;
      --shadow:    0 1px 2px rgba(0,0,0,.35);
      --sidebar-w: 340px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;
      background: #0c1317;
      color: var(--text);
    }
    button, textarea { font: inherit; }
    img { display: block; }

    /* ── SHELL ── */
    .shell {
      width: 100%; max-width: 1600px; height: 100dvh;
      margin: auto; display: flex;
      background: var(--bg);
      box-shadow: 0 0 40px rgba(0,0,0,.4);
    }

    /* ══════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
      display: flex; flex-direction: column;
      background: var(--panel);
      border-right: 1px solid rgba(255,255,255,.04);
      overflow: hidden; z-index: 20;
    }

    .sidebar-header {
      height: 64px; min-height: 64px; padding: 0 16px;
      display: flex; align-items: center;
      background: var(--panel-3);
      border-bottom: 1px solid rgba(255,255,255,.03);
    }
    .sidebar-title { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }

    .sidebar-search { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,.03); }
    .sidebar-search input {
      width: 100%; background: var(--panel-2);
      border: 0; outline: 0; border-radius: 8px;
      padding: 8px 14px; font-size: 14px; color: var(--text);
    }
    .sidebar-search input::placeholder { color: var(--muted); }

    .conversations { flex: 1; overflow-y: auto; }
    .conversations::-webkit-scrollbar { width: 5px; }
    .conversations::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    /* CONV WRAPPER — swipe container */
    .conv-wrapper { position: relative; overflow: hidden; }

    .conv-swipe-action {
      position: absolute; right: 0; top: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--danger); width: 72px; padding: 0;
    }
    .conv-swipe-action button {
      background: transparent; border: 0; color: #fff;
      font-size: 11px; font-weight: 700; cursor: pointer;
      letter-spacing: .3px; text-transform: uppercase;
    }

    /* CONV ITEM */
    .conv-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 16px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,.03);
      background: var(--panel);
      transition: background .12s, transform .2s ease;
      position: relative; z-index: 1;
    }
    .conv-item:hover  { background: var(--hover); }
    .conv-item.active { background: var(--active); }

    .conv-avatar { position: relative; flex: 0 0 auto; }
    .conv-avatar img {
      width: 50px; height: 50px; border-radius: 50%;
      object-fit: cover; background: #233138;
    }
    .online-dot {
      position: absolute; bottom: 1px; right: 1px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--green); border: 2px solid var(--panel);
    }

    .conv-info { flex: 1; min-width: 0; }
    .conv-name-row {
      display: flex; align-items: baseline;
      justify-content: space-between; gap: 6px;
    }
    .conv-name {
      font-size: 15px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .conv-time { font-size: 11.5px; color: var(--muted); white-space: nowrap; flex: 0 0 auto; }
    .conv-time.unread { color: var(--green); }

    .conv-preview-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: 6px; margin-top: 2px;
    }
    .conv-preview {
      font-size: 13px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    .conv-preview.typing { color: var(--green); }

    .unread-badge {
      flex: 0 0 auto; background: var(--green); color: #fff;
      font-size: 11.5px; font-weight: 700; min-width: 20px; height: 20px;
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; padding: 0 5px;
    }
    .unread-badge.hidden { display: none; }

    /* ══════════════════════════════════════
       CHAT PANEL
    ══════════════════════════════════════ */
    .chat-panel {
      flex: 1; min-width: 0; display: flex;
      flex-direction: column; overflow: hidden;
    }

    /* empty state */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; color: var(--muted); background: var(--bg);
    }
    .empty-state svg { opacity: .25; }
    .empty-state p { font-size: 15px; }

    /* TOPBAR */
    .topbar {
      min-height: 64px; padding: 8px 12px 8px 16px;
      display: flex; align-items: center; gap: 11px;
      background: var(--panel-3);
      border-bottom: 1px solid rgba(255,255,255,.03);
      z-index: 10; flex: 0 0 auto;
    }
    .back-btn {
      display: none; border: 0; background: transparent;
      color: var(--muted); cursor: pointer;
      width: 36px; height: 36px; border-radius: 50%;
      place-items: center;
    }
    .back-btn svg { width: 20px; height: 20px; fill: currentColor; }

    .topbar-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      object-fit: cover; background: #233138;
      flex: 0 0 auto; cursor: pointer;
      transition: opacity .15s;
    }
    .topbar-avatar:hover { opacity: .82; }

    .topbar-person { min-width: 0; flex: 1; }
    .topbar-name {
      font-size: 16px; font-weight: 600; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .topbar-status {
      font-size: 12.5px; color: var(--muted); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .top-actions { display: flex; gap: 4px; }
    .icon-btn {
      border: 0; background: transparent; color: #aebac1;
      cursor: pointer; width: 40px; height: 40px;
      border-radius: 50%; display: grid; place-items: center;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg { width: 21px; height: 21px; fill: currentColor; }

    /* CHAT AREA */
    .chat {
      position: relative; flex: 1; overflow-y: auto;
      padding: 18px max(14px, calc((100% - 900px)/2)) 12px;
      scroll-behavior: smooth;
      background:
        linear-gradient(rgba(11,20,26,.94), rgba(11,20,26,.94)),
        radial-gradient(circle at 20% 20%, #5b6b6f 0 1px, transparent 1.2px) 0 0/28px 28px,
        radial-gradient(circle at 80% 50%, #5b6b6f 0 1px, transparent 1.2px) 0 0/34px 34px,
        #0b141a;
    }
    .chat::-webkit-scrollbar { width: 5px; }
    .chat::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    /* DATE SEPARATOR */
    .day {
      width: max-content; max-width: 90%;
      margin: 4px auto 18px; padding: 6px 12px;
      color: #d1d7db; background: #182229;
      border-radius: 7px; font-size: 11.5px; box-shadow: var(--shadow);
    }

    /* ROWS */
    .row { display: flex; margin: 2px 0 5px; animation: fadeUp .16s ease; }
    .row.me  { justify-content: flex-end; }
    .row.her { justify-content: flex-start; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* BUBBLES */
    .bubble {
      position: relative; max-width: min(76%, 650px);
      padding: 7px 9px 6px; border-radius: 7.5px;
      box-shadow: var(--shadow); line-height: 1.35;
      word-wrap: break-word; overflow-wrap: anywhere;
      white-space: pre-wrap; font-size: 14.2px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end; column-gap: 7px;
      cursor: default;
      user-select: text;
    }
    .me  .bubble { background: var(--bubble-me);  border-top-right-radius: 2px; }
    .her .bubble { background: var(--bubble-her); border-top-left-radius:  2px; }

    /* REPLY QUOTE inside bubble */
    .bubble-reply {
      grid-column: 1 / -1;
      border-left: 3px solid var(--green);
      background: rgba(0,0,0,.18);
      border-radius: 4px;
      padding: 5px 8px;
      margin-bottom: 6px;
      cursor: pointer;
      overflow: hidden;
    }
    .bubble-reply-name {
      font-size: 11.5px; font-weight: 700; color: var(--green); margin-bottom: 1px;
    }
    .bubble-reply-text {
      font-size: 12.5px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .bubble-content { min-width: 0; max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }

    .meta {
      display: inline-flex; align-items: center;
      justify-content: flex-end; gap: 3px;
      color: #a8b3b9; font-size: 10.5px; line-height: 1;
      white-space: nowrap; align-self: end; padding-bottom: 1px;
    }
    .ticks { font-size: 12px; color: #53bdeb; letter-spacing: -2px; padding-right: 2px; }

    /* TYPING DOTS */
    .typing-bubble { display: inline-flex; gap: 4px; align-items: center; min-width: 50px; height: 30px; }
    .typing-bubble i {
      width: 6px; height: 6px; border-radius: 50%; background: #8c9aa3;
      animation: bounce 1.1s infinite ease-in-out;
    }
    .typing-bubble i:nth-child(2) { animation-delay: .13s; }
    .typing-bubble i:nth-child(3) { animation-delay: .26s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0);    opacity: .55; }
      30%            { transform: translateY(-4px); opacity: 1; }
    }

    /* REPLY BAR (above composer) */
    .reply-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px;
      background: var(--panel-3);
      border-top: 1px solid rgba(255,255,255,.05);
      flex: 0 0 auto;
    }
    .reply-indicator { width: 3px; align-self: stretch; background: var(--green); border-radius: 3px; flex: 0 0 3px; min-height: 28px; }
    .reply-bar-body { flex: 1; min-width: 0; }
    .reply-bar-name { font-size: 12px; font-weight: 700; color: var(--green); margin-bottom: 1px; }
    .reply-bar-msg  { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reply-bar-close {
      background: transparent; border: 0; color: var(--muted);
      cursor: pointer; width: 32px; height: 32px;
      border-radius: 50%; display: grid; place-items: center; font-size: 18px;
    }
    .reply-bar-close:hover { background: var(--hover); }

    /* COMPOSER */
    .composer {
      min-height: 62px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--panel-3);
      border-top: 1px solid rgba(255,255,255,.03);
      flex: 0 0 auto;
    }
    .input-wrap {
      flex: 1; display: flex; align-items: flex-end;
      background: var(--panel-2); border-radius: 22px; padding: 0 8px 0 10px;
    }
    #messageInput {
      width: 100%; max-height: 120px; min-height: 42px;
      resize: none; border: 0; outline: 0;
      background: transparent; color: var(--text);
      padding: 11px 4px 10px; line-height: 20px;
    }
    #messageInput::placeholder { color: #8696a0; }

    .send {
      flex: 0 0 auto; width: 44px; height: 44px;
      border-radius: 50%; border: 0; display: grid;
      place-items: center; background: var(--green);
      color: white; cursor: pointer; transition: .15s;
    }
    .send:disabled { opacity: .45; cursor: not-allowed; }
    .send svg { width: 21px; height: 21px; fill: currentColor; transform: translateX(1px); }

    /* SCROLL FAB */
    .scroll-fab {
      position: absolute; bottom: 76px; right: 14px;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--panel-2); border: 0; cursor: pointer;
      display: grid; place-items: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.5);
      transition: opacity .2s, transform .2s;
      z-index: 5; color: var(--text);
    }
    .scroll-fab.hidden { opacity: 0; pointer-events: none; transform: translateY(8px); }
    .scroll-fab svg { width: 22px; height: 22px; fill: currentColor; }

    /* MESSAGE CONTEXT MENU */
    .msg-menu {
      position: fixed; background: #1f2c33;
      border-radius: 10px; padding: 4px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,.6);
      z-index: 400; min-width: 168px;
      animation: fadeUp .12s ease;
    }
    .msg-menu button {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 16px;
      background: transparent; border: 0; color: var(--text);
      cursor: pointer; font-size: 14px; text-align: left;
    }
    .msg-menu button:hover { background: var(--hover); }
    .msg-menu button svg { width: 18px; height: 18px; fill: currentColor; opacity: .7; flex: 0 0 18px; }

    /* TOAST NOTIFICATION */
    .notif-toast {
      position: fixed; bottom: 22px; right: 22px;
      background: #1f2c33;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 14px; padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
      max-width: 300px; min-width: 230px;
      box-shadow: 0 6px 28px rgba(0,0,0,.6);
      transform: translateY(20px); opacity: 0;
      transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .28s;
      pointer-events: none; z-index: 500; cursor: pointer;
    }
    .notif-toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .notif-img  { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex: 0 0 42px; background: #233138; }
    .notif-body { flex: 1; min-width: 0; }
    .notif-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; color: var(--text); }
    .notif-msg  { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* CONNECTION BAR */
    .conn-bar {
      position: fixed; top: 0; left: 0; right: 0;
      background: #3b3612; color: #f0e68c;
      font-size: 13px; text-align: center; padding: 8px 12px;
      z-index: 600; transform: translateY(-100%);
      transition: transform .3s;
    }
    .conn-bar.show { transform: translateY(0); }

    /* PROFILE MODAL */
    .profile-modal {
      position: fixed; inset: 0; z-index: 300;
      display: flex; align-items: center; justify-content: center;
    }
    .profile-backdrop {
      position: absolute; inset: 0; background: rgba(0,0,0,.72); cursor: pointer;
    }
    .profile-card {
      position: relative; background: var(--panel);
      border-radius: 18px; padding: 36px 28px 28px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      width: 290px; box-shadow: 0 8px 40px rgba(0,0,0,.6);
      animation: fadeUp .2s ease;
    }
    .profile-close {
      position: absolute; top: 12px; right: 12px;
      background: transparent; border: 0; color: var(--muted);
      cursor: pointer; font-size: 18px; width: 32px; height: 32px;
      border-radius: 50%; display: grid; place-items: center;
    }
    .profile-close:hover { background: var(--hover); }
    .profile-avatar-wrap { position: relative; }
    .profile-avatar {
      width: 108px; height: 108px; border-radius: 50%;
      object-fit: cover; background: #233138;
    }
    .profile-online {
      position: absolute; bottom: 4px; right: 4px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--green); border: 3px solid var(--panel);
    }
    .profile-name   { font-size: 20px; font-weight: 700; text-align: center; margin-top: 4px; }
    .profile-status { font-size: 13px; color: var(--green); }

    /* CONFIRM MODAL */
    .confirm-modal {
      position: fixed; inset: 0; z-index: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .confirm-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.72); cursor: pointer; }
    .confirm-card {
      position: relative; background: var(--panel);
      border-radius: 16px; padding: 28px 24px 20px;
      width: min(300px, 90vw);
      box-shadow: 0 8px 40px rgba(0,0,0,.65);
      animation: fadeUp .18s ease;
      display: flex; flex-direction: column; gap: 10px;
    }
    .confirm-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .confirm-msg   { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .confirm-btn {
      border: 0; cursor: pointer; border-radius: 8px;
      padding: 9px 18px; font-size: 14px; font-weight: 600;
      transition: opacity .15s;
    }
    .confirm-btn:hover { opacity: .85; }
    .confirm-btn-cancel { background: var(--panel-2); color: var(--text); }
    .confirm-btn-ok     { background: var(--danger);  color: #fff; }

    /* ERROR TOAST */
    #errorBox {
      position: fixed; left: 50%; bottom: 78px;
      transform: translateX(-50%);
      background: #3b181d; color: #ffd9dd;
      border: 1px solid #6f2a34; border-radius: 9px;
      padding: 9px 12px; font-size: 13px; z-index: 999;
      max-width: min(90vw, 620px);
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }

    .hidden { display: none !important; }

    /* ══════════════════════════════════════
       MOBILE
    ══════════════════════════════════════ */
    @media (max-width: 699px) {
      .shell { position: relative; }

      .sidebar {
        position: absolute; inset: 0; width: 100%;
        transition: transform .22s ease;
      }
      .shell.chat-open .sidebar {
        transform: translateX(-100%); pointer-events: none;
      }
      .chat-panel {
        position: absolute; inset: 0;
        transform: translateX(100%);
        transition: transform .22s ease;
        background: var(--bg);
      }
      .shell.chat-open .chat-panel { transform: translateX(0); }
      .back-btn { display: grid; }
    }

    /* ══════════════════════════════════════
       DESKTOP
    ══════════════════════════════════════ */
    @media (min-width: 700px) {
      body { background: #0c1317; }
      .shell { border-left: 1px solid #1e2b32; border-right: 1px solid #1e2b32; }
    }
    @media (min-width: 900px) {
      .topbar   { padding-left: 18px; padding-right: 18px; }
      .composer { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>

<body>
  <!-- ════════ SHELL ════════ -->
  <div class="shell" id="shell">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Conversas</span>
      </div>
      <div class="sidebar-search">
        <input type="search" id="searchInput" placeholder="Pesquisar conversa" autocomplete="off">
      </div>
      <div class="conversations" id="convList"></div>
    </aside>

    <!-- CHAT PANEL -->
    <div class="chat-panel" id="chatPanel">

      <div class="empty-state" id="emptyState">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none">
          <path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2z"
                stroke="#e9edef" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <p>Selecione uma conversa</p>
      </div>

      <header class="topbar hidden" id="topbar">
        <button class="back-btn" id="backBtn" aria-label="Voltar">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <img id="topbarAvatar" class="topbar-avatar" src="" alt="">
        <div class="topbar-person">
          <div id="topbarName"   class="topbar-name"></div>
          <div id="topbarStatus" class="topbar-status"></div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="clearBtn" title="Limpar conversa" aria-label="Limpar conversa">
            <svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-2 6h10l-1 11H8L7 9Zm3 2v7h2v-7h-2Zm4 0v7h2v-7h-2Z"/></svg>
          </button>
        </div>
      </header>

      <section class="chat hidden" id="chat" aria-live="polite"></section>

      <!-- Reply bar (above composer) -->
      <div class="reply-bar hidden" id="replyBar">
        <div class="reply-indicator"></div>
        <div class="reply-bar-body">
          <div id="replyBarName" class="reply-bar-name"></div>
          <div id="replyBarMsg"  class="reply-bar-msg"></div>
        </div>
        <button class="reply-bar-close" id="replyBarClose" aria-label="Cancelar resposta">✕</button>
      </div>

      <footer class="composer hidden" id="composer">
        <div class="input-wrap">
          <textarea id="messageInput" rows="1" autocomplete="off" placeholder="Mensagem"></textarea>
        </div>
        <button id="sendBtn" class="send" aria-label="Enviar">
          <svg viewBox="0 0 24 24"><path d="m3.4 20.4 17.45-7.48c.76-.33.76-1.42 0-1.74L3.4 3.7c-.62-.27-1.27.22-1.13.88l1.3 5.94 8.63 1.53-8.63 1.54-1.3 5.93c-.14.66.51 1.15 1.13.88Z"/></svg>
        </button>
      </footer>

      <!-- Scroll FAB -->
      <button class="scroll-fab hidden" id="scrollFab" aria-label="Rolar para o fim">
        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </button>

    </div><!-- /chat-panel -->
  </div><!-- /shell -->

  <!-- TOAST NOTIFICATION -->
  <div id="notifToast" class="notif-toast" role="alert" aria-live="assertive">
    <img id="notifImg"  class="notif-img" src="" alt="">
    <div class="notif-body">
      <div id="notifName" class="notif-name"></div>
      <div id="notifMsg"  class="notif-msg"></div>
    </div>
  </div>

  <!-- CONNECTION BAR -->
  <div id="connBar" class="conn-bar">📵 Sem conexão com a internet</div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="profile-modal hidden">
    <div class="profile-backdrop" id="profileBackdrop"></div>
    <div class="profile-card">
      <button class="profile-close" id="profileClose">✕</button>
      <div class="profile-avatar-wrap">
        <img id="profileAvatar" class="profile-avatar" src="" alt="">
        <span class="profile-online"></span>
      </div>
      <div id="profileName"   class="profile-name"></div>
      <div id="profileStatus" class="profile-status"></div>
    </div>
  </div>

  <!-- CONFIRM MODAL -->
  <div id="confirmModal" class="confirm-modal hidden">
    <div class="confirm-backdrop" id="confirmBackdrop"></div>
    <div class="confirm-card">
      <div id="confirmTitle" class="confirm-title"></div>
      <div id="confirmMsg"   class="confirm-msg"></div>
      <div class="confirm-actions">
        <button id="confirmCancel" class="confirm-btn confirm-btn-cancel">Cancelar</button>
        <button id="confirmOk"     class="confirm-btn confirm-btn-ok">Apagar</button>
      </div>
    </div>
  </div>

  <!-- MESSAGE CONTEXT MENU -->
  <div id="msgMenu" class="msg-menu hidden"></div>

  <!-- ERROR -->
  <div id="errorBox" class="hidden"></div>

  <!-- CONFIGS -->
  <script src="pessoas-config.js"></script>
  <script src="julia-config.js"></script>
  <script src="yas-config.js"></script>

  <script>
  (() => {
    /* ─────────────────────────────────────────
       HELPERS
    ───────────────────────────────────────── */
    const $ = id => document.getElementById(id);

    function nowTime() {
      return new Intl.DateTimeFormat("pt-BR", { hour: "2-digit", minute: "2-digit" }).format(new Date());
    }

    function todayStr() {
      return new Intl.DateTimeFormat("pt-BR", {
        day: "2-digit", month: "2-digit", year: "numeric"
      }).format(new Date());
    }

    function getDateLabel(dateStr) {
      if (!dateStr) return "HOJE";
      const [d, m, y] = dateStr.split("/").map(Number);
      const msg  = new Date(y, m - 1, d);
      const now  = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diff  = Math.round((today - msg) / 86400000);
      if (diff <= 0) return "HOJE";
      if (diff === 1) return "ONTEM";
      if (diff < 7)   return msg.toLocaleDateString("pt-BR", { weekday: "long" }).replace(/^\w/, c => c.toUpperCase());
      return msg.toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });
    }

    function truncate(str, max = 48) {
      if (!str) return "";
      return str.length > max ? str.slice(0, max) + "…" : str;
    }

    let errorTimer;
    function showError(msg) {
      const box = $("errorBox");
      box.textContent = msg;
      box.classList.remove("hidden");
      clearTimeout(errorTimer);
      errorTimer = setTimeout(() => box.classList.add("hidden"), 6500);
    }

    /* ─────────────────────────────────────────
       AUDIO  (Web Audio API — sem arquivo)
    ───────────────────────────────────────── */
    let audioCtx = null;

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playNotifSound() {
      try {
        unlockAudio();
        const osc  = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.5);
      } catch {}
    }

    /* ─────────────────────────────────────────
       PERSONAS SETUP
    ───────────────────────────────────────── */
    const PERSONAS_LIST = window.PERSONAS_LIST || [];

    // state[id] = { cfg, messages[], unread, isSending, showTypingBubble }
    const state = {};
    PERSONAS_LIST.forEach(({ id, configVar }) => {
      state[id] = {
        cfg: window[configVar] || {},
        messages: [],
        unread: 0,
        isSending: false,
        showTypingBubble: false  // true after random delay fires
      };
    });

    /* ─────────────────────────────────────────
       PERSISTENCE
    ───────────────────────────────────────── */
    function storageKey(id) { return state[id].cfg.storageKey || `${id}-ai-chat-v1`; }
    function save(id)        { localStorage.setItem(storageKey(id), JSON.stringify(state[id].messages)); }

    function loadMessages(id) {
      const cfg = state[id].cfg;
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey(id)) || "null");
        if (Array.isArray(saved) && saved.length) {
          state[id].messages = saved;
        } else {
          state[id].messages = Array.isArray(cfg.initialMessages)
            ? cfg.initialMessages.map(m => ({ ...m, time: m.time || nowTime(), date: m.date || todayStr() }))
            : [];
        }
      } catch { state[id].messages = []; }
    }

    PERSONAS_LIST.forEach(({ id }) => loadMessages(id));

    /* ─────────────────────────────────────────
       CONNECTION MONITOR
    ───────────────────────────────────────── */
    const connBar = $("connBar");
    function updateConn() { connBar.classList.toggle("show", !navigator.onLine); }
    window.addEventListener("online",  updateConn);
    window.addEventListener("offline", updateConn);
    updateConn();

    /* ─────────────────────────────────────────
       TOAST NOTIFICATION
    ───────────────────────────────────────── */
    const notifToast = $("notifToast");
    const notifImg   = $("notifImg");
    const notifName  = $("notifName");
    const notifMsg   = $("notifMsg");
    let toastTimer;
    let toastQueue   = [];
    let toastBusy    = false;
    let toastPersonaId = null;

    function showToast(personaId, message) {
      toastQueue.push({ personaId, message });
      if (!toastBusy) drainToast();
    }

    function drainToast() {
      if (!toastQueue.length) { toastBusy = false; return; }
      toastBusy = true;
      const { personaId, message } = toastQueue.shift();
      toastPersonaId = personaId;
      const cfg = state[personaId].cfg;
      notifImg.src = cfg.photo || "";
      notifImg.alt = cfg.name  || personaId;
      notifName.textContent = cfg.name || personaId;
      notifMsg.textContent  = truncate(message.content, 58);
      notifToast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        notifToast.classList.remove("show");
        setTimeout(drainToast, 340);
      }, 4000);
    }

    notifToast.addEventListener("click", () => {
      if (toastPersonaId) openConversation(toastPersonaId);
      notifToast.classList.remove("show");
      clearTimeout(toastTimer);
      toastBusy = false;
      drainToast();
    });

    /* ─────────────────────────────────────────
       PROFILE MODAL
    ───────────────────────────────────────── */
    function openProfile(id) {
      const cfg = state[id].cfg;
      $("profileAvatar").src = cfg.photo || "";
      $("profileAvatar").alt = cfg.name  || id;
      $("profileName").textContent   = cfg.name   || id;
      $("profileStatus").textContent = cfg.status || "online";
      $("profileModal").classList.remove("hidden");
    }
    function closeProfile() { $("profileModal").classList.add("hidden"); }
    $("profileClose").addEventListener("click",   closeProfile);
    $("profileBackdrop").addEventListener("click", closeProfile);

    /* ─────────────────────────────────────────
       SIDEBAR TYPING STATUS
    ───────────────────────────────────────── */
    const sidebarTyping = {}; // personaId → bool

    function setSidebarTyping(id, bool) {
      sidebarTyping[id] = bool;
      renderSidebar($("searchInput").value);
    }

    /* ─────────────────────────────────────────
       SIDEBAR RENDER
    ───────────────────────────────────────── */
    const convList = $("convList");

    function lastMsg(id) {
      const msgs = state[id].messages;
      return msgs.length ? msgs[msgs.length - 1] : null;
    }

    function renderSidebar(filter = "") {
      convList.innerHTML = "";
      const q = filter.trim().toLowerCase();

      PERSONAS_LIST.forEach(({ id }) => {
        const { cfg, unread } = state[id];
        if (q && !cfg.name?.toLowerCase().includes(q)) return;

        const last    = lastMsg(id);
        const isTyping = sidebarTyping[id];
        const preview = isTyping
          ? "digitando…"
          : (last ? (last.role === "user" ? "Você: " : "") + truncate(last.content) : "");
        const previewTime = last?.time || "";

        /* wrapper for swipe */
        const wrapper = document.createElement("div");
        wrapper.className = "conv-wrapper";

        /* swipe action (clear) */
        const swipeEl = document.createElement("div");
        swipeEl.className = "conv-swipe-action";
        swipeEl.innerHTML = `<button aria-label="Limpar conversa">Limpar</button>`;

        swipeEl.querySelector("button").addEventListener("click", e => {
          e.stopPropagation();
          clearConversation(id);
          item.style.transform = "";
        });
        wrapper.appendChild(swipeEl);

        /* conversation item */
        const item = document.createElement("div");
        item.className = "conv-item" + (currentId === id ? " active" : "");
        item.dataset.id = id;
        item.innerHTML = `
          <div class="conv-avatar">
            <img src="${cfg.photo || ""}" alt="${cfg.name || id}" onerror="this.style.visibility='hidden'">
            <span class="online-dot"></span>
          </div>
          <div class="conv-info">
            <div class="conv-name-row">
              <span class="conv-name">${cfg.name || id}</span>
              <span class="conv-time${unread ? " unread" : ""}">${previewTime}</span>
            </div>
            <div class="conv-preview-row">
              <span class="conv-preview${isTyping ? " typing" : ""}">${preview}</span>
              <span class="unread-badge${unread ? "" : " hidden"}">${unread || ""}</span>
            </div>
          </div>`;
        item.addEventListener("click", () => openConversation(id));
        wrapper.appendChild(item);

        /* ── SWIPE (mobile) ── */
        let tx = 0, startX = 0, startY = 0, dragging = false, swipeOpen = false;
        const THRESHOLD = 60, MAX_SWIPE = 90;

        item.addEventListener("touchstart", e => {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          dragging = false;
        }, { passive: true });

        item.addEventListener("touchmove", e => {
          const dx = e.touches[0].clientX - startX;
          const dy = e.touches[0].clientY - startY;
          if (!dragging && Math.abs(dy) > Math.abs(dx)) return; // vertical scroll wins
          dragging = true;
          if (swipeOpen) {
            tx = -MAX_SWIPE + Math.max(0, dx);
          } else {
            tx = Math.max(dx, -MAX_SWIPE);
          }
          if (tx > 0) tx = 0;
          item.style.transform = `translateX(${tx}px)`;
        }, { passive: true });

        item.addEventListener("touchend", e => {
          if (!dragging) return;
          const dx = e.changedTouches[0].clientX - startX;
          if (!swipeOpen && dx < -THRESHOLD) {
            swipeOpen = true;
            item.style.transform = `translateX(-${MAX_SWIPE}px)`;
          } else {
            swipeOpen = false;
            item.style.transform = "";
          }
        });

        convList.appendChild(wrapper);
      });
    }

    /* ─────────────────────────────────────────
       SCROLL FAB
    ───────────────────────────────────────── */
    const scrollFab = $("scrollFab");
    const chatEl    = $("chat");

    function updateScrollFab() {
      const atBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 100;
      scrollFab.classList.toggle("hidden", atBottom);
    }

    chatEl.addEventListener("scroll", updateScrollFab, { passive: true });
    scrollFab.addEventListener("click", () => {
      chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: "smooth" });
    });

    /* ─────────────────────────────────────────
       REPLY STATE
    ───────────────────────────────────────── */
    let replyState = null; // { role, content }

    function setReply(msg, personaName) {
      replyState = { role: msg.role, content: msg.content };
      $("replyBarName").textContent = msg.role === "user" ? "Você" : (personaName || "");
      $("replyBarMsg").textContent  = msg.content;
      $("replyBar").classList.remove("hidden");
      $("messageInput").focus();
    }

    function clearReply() {
      replyState = null;
      $("replyBar").classList.add("hidden");
    }

    $("replyBarClose").addEventListener("click", clearReply);

    /* ─────────────────────────────────────────
       MESSAGE CONTEXT MENU
    ───────────────────────────────────────── */
    const msgMenu = $("msgMenu");
    let menuCloseHandler = null;

    function showMsgMenu(x, y, message, personaName) {
      msgMenu.innerHTML = `
        <button id="menuReply">
          <svg viewBox="0 0 24 24"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>
          Responder
        </button>`;
      msgMenu.classList.remove("hidden");

      // position near click, keep inside viewport
      const W = 180, H = 52;
      const vw = window.innerWidth, vh = window.innerHeight;
      msgMenu.style.left = Math.min(Math.max(x, 8), vw - W - 8) + "px";
      msgMenu.style.top  = Math.min(Math.max(y, 8), vh - H - 8) + "px";

      $("menuReply").addEventListener("click", () => {
        setReply(message, personaName);
        closeMsgMenu();
      });

      if (menuCloseHandler) document.removeEventListener("click", menuCloseHandler);
      setTimeout(() => {
        menuCloseHandler = () => closeMsgMenu();
        document.addEventListener("click", menuCloseHandler, { once: true });
      }, 10);
    }

    function closeMsgMenu() {
      msgMenu.classList.add("hidden");
      if (menuCloseHandler) { document.removeEventListener("click", menuCloseHandler); menuCloseHandler = null; }
    }

    /* ─────────────────────────────────────────
       CHAT RENDERING
    ───────────────────────────────────────── */
    const emptyState = $("emptyState");
    const topbar     = $("topbar");
    const composer   = $("composer");
    const topbarAv   = $("topbarAvatar");
    const topbarName = $("topbarName");
    const topbarStat = $("topbarStatus");

    function insertDayLabel(label) {
      const div = document.createElement("div");
      div.className = "day";
      div.textContent = label;
      chatEl.appendChild(div);
    }

    function bubble(message, temporary = false, personaName = null) {
      const row = document.createElement("div");
      row.className = `row ${message.role === "user" ? "me" : "her"}`;
      if (temporary) row.dataset.temporary = "true";

      const b = document.createElement("div");
      b.className = "bubble";

      /* reply quote */
      if (!temporary && message.replyTo) {
        const quote = document.createElement("div");
        quote.className = "bubble-reply";
        const author = message.replyTo.role === "user" ? "Você" : (personaName || "");
        const quoteText = document.createElement("div");
        quoteText.className = "bubble-reply-text";
        quoteText.textContent = truncate(message.replyTo.content, 65);
        const quoteName = document.createElement("div");
        quoteName.className = "bubble-reply-name";
        quoteName.textContent = author;
        quote.appendChild(quoteName);
        quote.appendChild(quoteText);
        b.appendChild(quote);
      }

      const content = document.createElement("div");
      content.className = "bubble-content";

      if (temporary) {
        const dots = document.createElement("span");
        dots.className = "typing-bubble";
        dots.innerHTML = "<i></i><i></i><i></i>";
        content.appendChild(dots);
      } else {
        content.textContent = message.content;
      }

      b.appendChild(content);

      if (!temporary) {
        const meta = document.createElement("span");
        meta.className = "meta";
        if (message.role === "user") {
          const ticks = document.createElement("span");
          ticks.className = "ticks";
          ticks.textContent = "✓✓";
          meta.appendChild(ticks);
        }
        const t = document.createElement("span");
        t.textContent = message.time || nowTime();
        meta.appendChild(t);
        b.appendChild(meta);

        /* context menu: right-click (desktop) or long-press (mobile) */
        let lpTimer = null;
        b.addEventListener("contextmenu", e => {
          e.preventDefault();
          showMsgMenu(e.clientX, e.clientY, message, personaName);
        });
        b.addEventListener("touchstart", () => {
          lpTimer = setTimeout(() => showMsgMenu(52, window.innerHeight / 2, message, personaName), 500);
        }, { passive: true });
        b.addEventListener("touchend",  () => clearTimeout(lpTimer));
        b.addEventListener("touchmove", () => clearTimeout(lpTimer));
      }

      row.appendChild(b);
      chatEl.appendChild(row);
      chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: "smooth" });
      updateScrollFab();
      return row;
    }

    function renderChat(id) {
      chatEl.querySelectorAll(".row, .day").forEach(el => el.remove());
      const pName  = state[id].cfg.name;
      let lastDate = null;
      state[id].messages.forEach(m => {
        const d = m.date || todayStr();
        if (d !== lastDate) { insertDayLabel(getDateLabel(d)); lastDate = d; }
        bubble(m, false, pName);
      });
      // if still waiting for response, show typing indicator
      if (state[id].showTypingBubble) {
        bubble({ role: "assistant", content: "" }, true, pName);
      }
      chatEl.scrollTop = chatEl.scrollHeight;
      updateScrollFab();
    }

    /* ─────────────────────────────────────────
       OPEN CONVERSATION
    ───────────────────────────────────────── */
    let currentId = null;

    function openConversation(id) {
      currentId = id;
      const { cfg } = state[id];
      state[id].unread = 0;

      topbarAv.src = cfg.photo || "";
      topbarAv.alt = cfg.name  || id;
      topbarName.textContent = cfg.name || id;
      topbarStat.textContent = sidebarTyping[id] ? "digitando…" : (cfg.status || "online");
      document.title = cfg.name || "Chat";

      emptyState.classList.add("hidden");
      topbar.classList.remove("hidden");
      chatEl.classList.remove("hidden");
      composer.classList.remove("hidden");

      clearReply();
      renderChat(id);
      renderSidebar($("searchInput").value);

      $("shell").classList.add("chat-open");
      $("messageInput").focus();
    }

    topbarAv.addEventListener("click", () => { if (currentId) openProfile(currentId); });
    $("backBtn").addEventListener("click", () => { $("shell").classList.remove("chat-open"); });
    $("searchInput").addEventListener("input", e => renderSidebar(e.target.value));

    /* ─────────────────────────────────────────
       SEND MESSAGE
    ───────────────────────────────────────── */
    const input   = $("messageInput");
    const sendBtn = $("sendBtn");

    function autoResize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    }

    function updateSendBtn() {
      sendBtn.disabled = !!(currentId && state[currentId]?.isSending);
    }

    async function send() {
      if (!currentId) return;
      const text = input.value.trim();
      if (!text) return;

      const personaId = currentId;
      if (state[personaId].isSending) return;

      const { cfg } = state[personaId];

      if (!cfg.apiUrl || cfg.apiUrl.includes("SEU-WORKER")) {
        showError("Configure apiUrl em " + personaId + "-config.js com a URL do seu Cloudflare Worker.");
        return;
      }

      unlockAudio(); // unlock on user gesture

      state[personaId].isSending = true;
      updateSendBtn();

      /* capture and clear reply */
      const capturedReply = replyState ? { ...replyState } : null;
      clearReply();

      /* user message */
      const userMsg = {
        role:    "user",
        content: text,
        time:    nowTime(),
        date:    todayStr(),
        ...(capturedReply ? { replyTo: capturedReply } : {})
      };
      state[personaId].messages.push(userMsg);
      save(personaId);

      if (currentId === personaId) bubble(userMsg, false, cfg.name);
      renderSidebar($("searchInput").value);

      input.value = "";
      autoResize();

      /* ── RANDOM RESPONSE DELAY (2–20s) ── */
      const waitMin = cfg.responseDelayMin ?? 2000;
      const waitMax = cfg.responseDelayMax ?? 20000;
      const waitMs  = waitMin + Math.random() * (waitMax - waitMin);

      setSidebarTyping(personaId, true);
      if (currentId === personaId) topbarStat.textContent = "digitando…";

      await new Promise(r => setTimeout(r, waitMs));

      /* show typing bubble AFTER the delay */
      state[personaId].showTypingBubble = true;
      if (currentId === personaId) {
        bubble({ role: "assistant", content: "" }, true, cfg.name);
      }

      const started = Date.now();

      try {
        /* build recent history, injecting reply context into current message */
        const recent = state[personaId].messages
          .slice(-(cfg.maxHistoryMessages || 24))
          .map(({ role, content, replyTo }) => ({
            role,
            content: replyTo
              ? `[Em resposta a: "${replyTo.content.slice(0, 80)}"]\n${content}`
              : content
          }));

        const res = await fetch(cfg.apiUrl, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({
            model:        cfg.model        || "openrouter/free",
            systemPrompt: cfg.systemPrompt || "",
            messages:     recent,
            temperature:  cfg.temperature  ?? 0.85,
            maxTokens:    cfg.maxTokens    || 500
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || `Erro HTTP ${res.status}`);

        /* small post-response realism delay */
        const elapsed = Date.now() - started;
        if (elapsed < 300) await new Promise(r => setTimeout(r, 300 - elapsed));

        const rawAnswer =
          data?.choices?.[0]?.message?.content?.trim() ||
          data?.content?.trim();

        if (!rawAnswer) throw new Error("Resposta vazia da IA.");

        /* remove typing bubbles */
        state[personaId].showTypingBubble = false;
        chatEl.querySelectorAll("[data-temporary='true']").forEach(el => el.remove());

        /* split response into sequential messages */
        const parts = rawAnswer.split(/\n\n+/).map(s => s.trim()).filter(Boolean);

        for (let i = 0; i < parts.length; i++) {
          if (i > 0) await new Promise(r => setTimeout(r, 220 + Math.random() * 280));

          const assistantMsg = {
            role:    "assistant",
            content: parts[i],
            time:    nowTime(),
            date:    todayStr()
          };

          state[personaId].messages.push(assistantMsg);
          save(personaId);

          if (currentId === personaId) {
            bubble(assistantMsg, false, cfg.name);
          } else {
            state[personaId].unread = (state[personaId].unread || 0) + 1;
            if (i === parts.length - 1) {
              playNotifSound();
              showToast(personaId, assistantMsg);
            }
          }
        }

        renderSidebar($("searchInput").value);

      } catch (err) {
        state[personaId].showTypingBubble = false;
        chatEl.querySelectorAll("[data-temporary='true']").forEach(el => el.remove());
        showError("Não consegui responder: " + (err?.message || "erro desconhecido"));
      } finally {
        setSidebarTyping(personaId, false);
        state[personaId].isSending = false;
        if (currentId === personaId) {
          topbarStat.textContent = cfg.status || "online";
          updateSendBtn();
          input.focus();
        }
      }
    }

    input.addEventListener("input", autoResize);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    sendBtn.addEventListener("click", send);

    /* ─────────────────────────────────────────
       CONFIRM MODAL
    ───────────────────────────────────────── */
    function showConfirm(title, msg) {
      return new Promise(resolve => {
        $("confirmTitle").textContent = title;
        $("confirmMsg").textContent   = msg;
        $("confirmModal").classList.remove("hidden");

        const ok       = $("confirmOk");
        const cancel   = $("confirmCancel");
        const backdrop = $("confirmBackdrop");

        function done(result) {
          $("confirmModal").classList.add("hidden");
          ok.removeEventListener("click", onOk);
          cancel.removeEventListener("click", onCancel);
          backdrop.removeEventListener("click", onCancel);
          resolve(result);
        }
        function onOk()     { done(true);  }
        function onCancel() { done(false); }

        ok.addEventListener("click",      onOk);
        cancel.addEventListener("click",  onCancel);
        backdrop.addEventListener("click", onCancel);
      });
    }

    /* ─────────────────────────────────────────
       CLEAR CONVERSATION
    ───────────────────────────────────────── */
    async function clearConversation(id) {
      const personaName = state[id].cfg.name || id;
      const ok = await showConfirm(
        "Limpar conversa",
        `Apagar toda a conversa com ${personaName}? Esta ação não pode ser desfeita.`
      );
      if (!ok) return;
      const cfg = state[id].cfg;
      localStorage.removeItem(storageKey(id));
      state[id].messages = Array.isArray(cfg.initialMessages)
        ? cfg.initialMessages.map(m => ({ ...m, time: m.time || nowTime(), date: m.date || todayStr() }))
        : [];
      save(id);
      if (currentId === id) renderChat(id);
      renderSidebar($("searchInput").value);
    }

    $("clearBtn").addEventListener("click", () => { if (currentId) clearConversation(currentId); });

    /* ─────────────────────────────────────────
       INIT
    ───────────────────────────────────────── */

    // unread badge for personas showing only initial messages (first open)
    PERSONAS_LIST.forEach(({ id }) => {
      const { cfg, messages } = state[id];
      if (Array.isArray(cfg.initialMessages) && cfg.initialMessages.length &&
          messages.length === cfg.initialMessages.length) {
        state[id].unread = cfg.initialMessages.filter(m => m.role !== "user").length;
      }
    });

    // auto-open first persona on desktop
    if (window.innerWidth >= 700 && PERSONAS_LIST.length) {
      openConversation(PERSONAS_LIST[0].id);
    } else {
      renderSidebar();
    }

    autoResize();
  })();
  </script>
</body>
</html>
